catalogMode: prefer

minimumReleaseAgeExclude:
  - bumpp@12.2.1
shellEmulator: true

trustPolicy: no-downgrade

packages: []
catalogs:
  build:
    tsdown: ^0.22.14
  cli:
    bumpp: ^12.2.1
    pncat: ^0.13.2
    taze: ^20.0.1
  lint:
    '@octohash/eslint-config': ^0.5.3
    eslint: ^10.8.1
    lint-staged: ^17.3.0
    simple-git-hooks: ^2.13.1
  network:
    ofetch: ^1.5.1
  node:
    '@clack/prompts': ^1.7.0
    ansis: ^4.3.1
    cac: ^7.0.0
    pathe: ^2.0.3
  script:
    tsx: ^4.23.12
  test:
    vitest: ^4.1.10
  tsc:
    typescript: ^6.0.3
  types:
    '@types/node': ^26.2.0
  utils:
    p-limit: ^7.3.1
    p-retry: ^8.0.0
onlyBuiltDependencies:
  - esbuild
  - simple-git-hooks
allowBuilds:
  esbuild: true
  simple-git-hooks: true
